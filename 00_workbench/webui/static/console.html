<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yuanhe Bio Console · MurJ Scaffold design pipeline</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 26 L16 4 L28 26 Z' fill='none' stroke='%2338bdf8' stroke-width='3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/design-tokens.css"><link rel="stylesheet" href="/css/legacy-premium.css"></head>
<body>
<div id="app" class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M3 27 L16 3 L29 27 Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M10 27 L16 15 L22 27 Z" fill="currentColor" opacity=".22"/>
        <circle cx="16" cy="3" r="2.6" fill="currentColor"/>
      </svg>
      <div class="brand-text">
        <strong>Yuanhe Bio</strong>
        <span>MurJ Scaffold design console</span>
      </div>
    </div>

    <nav class="nav" id="nav" aria-label="Main navigation"></nav>

    <div class="sidebar-foot">
      <div class="foot-stat" id="foot-status">
        <span class="dot dot-idle"></span><span>Connecting...</span>
      </div>
      <div class="foot-meta" id="foot-meta"></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn nav-toggle" id="nav-toggle" title="Menu" aria-label="Toggle menu">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
      </button>
      <div class="crumb" id="crumb">
        <span class="crumb-root">Yuanhe Bio</span>
      </div>
      <div class="topbar-right">
        <span class="pill" id="pill-data" title="Result file status">Data</span>
        <button class="icon-btn" id="btn-refresh" title="Reload result files and refresh the current page">
          <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn" id="btn-theme" title="Toggle light/dark theme">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <main class="content" id="view" tabindex="-1">
      <div class="loading-pane"><span class="spinner"></span> Loading...</div>
    </main>
  </div>
</div>

<div class="toast-stack" id="toasts" aria-live="polite"></div>
<div class="tooltip" id="tooltip" hidden></div>

<script type="module" src="/js/app.js"></script>
<noscript><p style="padding:2rem;color:#e6edf3">This console requires JavaScript. </p></noscript>
</body>
</html>
