target_id: ecmurj
display_name: "E. coli MurJ (MOP flippase) - local TM2/TM7 region"
organism: "Escherichia coli K-12"
uniprot: P0AF16
native_length: 511
screening_mode: membrane_aware

structures:
  primary:
    pdb_id: 9NU4
    chain: A
    species: "Escherichia coli"
    role: "reference construct (Sgl-bound, outward-facing)"
    source_url: "https://www.ebi.ac.uk/pdbe/entry-files/download/9nu4_updated.cif"
    conformational_state: "outward-facing / Sgl-bound"
    notes: "chain A carries the K5F/S12I/M13A construct plus an N-terminal fusion and a C-terminal tag"
  comparisons:
    - pdb_id: 9NU5
      chain: A
      role: "comparison, Sgl-bound state"
    - pdb_id: 9NU8
      chain: A
      role: "comparison, Sgl-bound state"
    - pdb_id: 6CC4
      chain: A
      role: "comparison, inward-open (fusion protein)"
    - pdb_id: 7WAG
      chain: A
      role: "comparison, squeezed state (V10R/S11C)"

construct:
  declared_length: 614
  # Author numbering equals native numbering for this construct (auth 3 == P0AF16 3);
  # the mmCIF label_seq_id is auth + 104 (label 107 == auth 3).
  native_range: [3, 500]
  label_native_offset: 0
  fusion_nterm: [1, 106]
  mutations:
    - {auth_resseq: 5, construct_resname: PHE, native_resname: LYS}
    - {auth_resseq: 12, construct_resname: ILE, native_resname: SER}
    - {auth_resseq: 13, construct_resname: ALA, native_resname: MET}
  c_terminal_tag:
    sequence: SAWSHPQFEK
    auth_range: [501, 510]
    note: "affinity tag after native residue 500"

region:
  contact_cutoff_A: 4.5
  sides:
    - name: TM2
      chain: A
      native_residues: [50, 51, 53, 54]
      note: "lateral gate / TM2 side of the proposed cavity"
    - name: TM7
      chain: A
      native_residues: [237, 240, 241, 244]
      note: "TM7 side of the proposed cavity"
  box_padding_A: 5.0
  box_min_size_A: 14.0
  box_max_size_A: 30.0

membrane:
  status: evidence_available
  method: PPM3_rigid_construct_transfer
  source: https://oprlm.org/ppm_server3_cgopm
  evidence_dir: ../membrane/9nu4
  uncertainty: computational_placement_not_experimental
  note: "Hashed PPM3 evidence is transferred only after a rigid receptor-identity check."

# Y-MAVS: membrane-aware virtual screening.  All thresholds below are geometric
# partition/algorithm parameters, not calibrated affinity weights.  MurJ-specific
# structural annotations stay in this target file; the engine itself is generic.
membrane_screening:
  enabled: true

  orientation:
    require_verified_source: true
    allow_proxy_for_exploration: true

  geometry:
    interface_buffer_A: 5.0
    proxy_thickness_A: 30.0

  pocket:
    contact_cutoff_A: 5.0
    embedded_core_fraction: 0.60
    interface_fraction: 0.50
    aqueous_outside_fraction: 0.60
    mixed_min_fraction: 0.20

  accessibility:
    enabled: true
    grid_spacing_A: 1.0
    probe_radius_A: 1.4
    margin_A: 8.0
    seed_radius_A: 3.0
    max_grid_points: 1500000
    method: grid_connectivity

  compatibility:
    enabled: true
    explicit_lipid_check: optional
    lipid_clash_cutoff_A: 2.0
    contact_cutoff_A: 4.5

  # These are real deposited structures for MurJ conformational comparisons.
  # No per-state GNINA results are fabricated.  With ensemble.enabled=false the
  # list is provenance/configuration only; enabling it requires real per-state
  # evidence manifests and state-specific membrane orientation.
  ensemble:
    enabled: false
    receptors:
      - structure_id: 9NU4
        pdb_id: 9NU4
        chain: A
        conformational_state: outward_facing_sgl_bound
        role: reference
        is_primary: true
      - structure_id: 9NU5
        pdb_id: 9NU5
        chain: A
        conformational_state: sgl_bound_comparison
      - structure_id: 9NU8
        pdb_id: 9NU8
        chain: A
        conformational_state: sgl_bound_comparison
      - structure_id: 6CC4
        pdb_id: 6CC4
        chain: A
        conformational_state: inward_open_fusion
      - structure_id: 7WAG
        pdb_id: 7WAG
        chain: A
        conformational_state: squeezed_v10r_s11c

  scoring:
    enabled: true
    strategy: evidence_first
    preserve_baseline: true
    allow_proxy_for_exploration: true
    require_verified_orientation_for_formal: true
    allow_pose_reselection: false

  # Additive to the budget's existing formal requirements.  Accessibility is
  # auxiliary in phase 1; ensemble evidence is optional for single-state MurJ runs.
  qualification:
    formal_requirements:
      - membrane_geometry
      - pocket_localization
    accessibility_evidence: auxiliary
    ensemble_evidence: optional
    require_complete_ensemble_states: false

md_protocol:
  engine: gromacs
  membrane_required: true
  note: "Standalone membrane module checks force fields, orientation and runtime before execution."

analysis_selections:
  tv_region: "TM2/TM7 native residues listed above"
  distal_control: "not configured"
