defaults:
  host_profile: local
paths:
  structures_dir: ""
  scratch: ""
# Run this module inside the Linux/WSL or macOS chemistry environment.
# Official Vina is a CPU engine; redocking is serial here, 4 threads per job.
tools:
  vina: [vina]
  vina_settings:
    engine_version: 1.2.7
    scoring: vina
    exhaustiveness: 32
    num_modes: 9
    energy_range: 3.0
    cpu: 4
    timeout_seconds: 3600
  gromacs: [gmx]
executors:
  vina:
    mode: auto
    command: [vina]
  md_openmm_linux:
    mode: disabled
    note: "Enable via an explicitly reviewed MD handoff; aqueous OpenMM and membrane GROMACS are separate protocols."
  zlis:
    mode: auto
    command: [bash, run.sh]
