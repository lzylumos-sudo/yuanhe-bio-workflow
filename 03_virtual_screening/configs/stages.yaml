scoring:
  weights:
    affinity: 0.34
    cnn_pose: 0.18
    cnn_affinity: 0.18
    mechanism: 0.18
    pose_quality: 0.12
  affinity_floor: 0.0

mechanism:
  contact_cutoff_A: 4.5
  hbond_cutoff_A: 3.5

pose_qa:
  clash_cutoff_A: 2.0
  box_escape_fraction: 0.9

motion:
  cluster_rmsd_A: 2.0

redock:
  enabled: true
  exhaustiveness: 8
  num_modes: 3

md:
  engine: openmm
  membrane_required: true

filters:
  membrane_alert_burden_max: 3

# Experimental Pareto-first selection is opt-in; qualification thresholds unchanged.
selection:
  strategy: evidence_diversity

# Y-MAVS defaults. Target-level `membrane_screening` values override these keys.
# Values here are geometric partition/algorithm parameters, not fitted weights.
membrane_screening:
  enabled: false
  orientation:
    require_verified_source: true
    allow_proxy_for_exploration: true
  geometry:
    interface_buffer_A: 5.0
    # Used only when no sourced orientation exists. The resulting geometry is
    # labelled proxy_only and never satisfies formal membrane qualification.
    proxy_thickness_A: 30.0
  pocket:
    contact_cutoff_A: 5.0
    embedded_core_fraction: 0.60
    interface_fraction: 0.50
    aqueous_outside_fraction: 0.60
    mixed_min_fraction: 0.20
  accessibility:
    enabled: true
    grid_spacing_A: 1.0
    probe_radius_A: 1.4
    margin_A: 8.0
    seed_radius_A: 3.0
    max_grid_points: 1500000
    method: grid_connectivity
  compatibility:
    enabled: true
    explicit_lipid_check: optional
    lipid_clash_cutoff_A: 2.0
    contact_cutoff_A: 4.5
  ensemble:
    enabled: false
    receptors: []
    alignment_min_ca: 12
    alignment_max_rmsd_A: 2.5
  scoring:
    enabled: true
    strategy: evidence_first
    preserve_baseline: true
    allow_proxy_for_exploration: true
    require_verified_orientation_for_formal: true
    allow_pose_reselection: false
  qualification:
    formal_requirements: []
    accessibility_evidence: auxiliary
    ensemble_evidence: optional
    require_complete_ensemble_states: false
