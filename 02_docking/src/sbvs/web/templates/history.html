{% extends 'base.html' %}{% block content %}<h1>历史任务</h1><table><tr><th>Run ID</th><th>状态</th><th>目录 / 操作</th></tr>{% for j in jobs %}<tr><td><a href="{{url_for('home')}}?run={{j.id}}">{{j.id}}</a></td><td>{{j.status}}</td><td>{{j.path}}{% if j.status in ['interrupted','cancelled','failed','partial_failed'] %}<button data-action="{{url_for('resume',rid=j.id)}}">恢复 / 重试失败条目</button>{% elif j.status in ['queued','preparing','running'] %}<button data-action="{{url_for('cancel',rid=j.id)}}">取消</button>{% endif %}</td></tr>{% endfor %}</table><p id="message"></p><script>for(let b of document.querySelectorAll('[data-action]'))b.onclick=async()=>{let r=await fetch(b.dataset.action,{method:'POST',headers:{'X-SBVS-Request':'local-ui'}});let d=await r.json();document.getElementById('message').textContent=d.error||'已提交';if(r.ok)location.reload();};</script>{% endblock %}
