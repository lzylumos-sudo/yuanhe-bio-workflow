# Cross-platform environment spec for the v2 platform (osx-arm64 dev, linux-64 compute).
# Verified combination: meeko 0.8.0 (pip) requires rdkit WITHOUT rdkit.six removal issue -> conda meeko (0.5/0.7) is NOT compatible with rdkit 2026.x.
name: sbvs2
channels: [conda-forge]
dependencies:
  - python=3.12.15
  - rdkit=2026.03.1
  - openmm=8.6.1
  - pdbfixer=1.12
  - vina=1.2.7
  - numpy=2.5.4
  - scipy=1.18.1
  - pyyaml
  - flask
  - filelock
  - psutil
  - jinja2
  - matplotlib-base
  - pytest
  - pip
  - pip:
      - meeko==0.8.0
      - gemmi==0.7.5
      - molscrub==0.2.2
