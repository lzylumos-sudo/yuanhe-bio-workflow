      "source_snapshot": "protein:\n  rebuild_hydrogens: true\n  ph: 7.0\n  remove_water: true\n  remove_heterogens: false\n  allow_missing_residues: false\nMD:\n  engine: openmm\n  temperature: 300\n  pressure: 1\n  timestep: 2fs\n  minimization: true\n  minimization_max_iterations: 5000\n  equilibration: 2ns\n  nvt: 1ns\n  npt: 1ns\n  heating_duration: 100ps\n  initial_temperature: 50\n  production: 500ns\n  protein_forcefield: amber14-all.xml\n  water_forcefield: amber14/tip3p.xml\n  ligand_forcefield: gaff-2.11\n  water_model: tip3p\n  padding_nm: 1.2\n  ionic_strength_molar: 0.15\n  nonbonded_cutoff_nm: 0.9\n  switch_distance_nm: 0.8\n  friction_per_ps: 1.0\n  restraint_k_kj_mol_nm2: 1000\n  platform: auto\n  require_gpu: true\n  device_index: \"0\"\n  charge_method: resp\n  qm_threads: 4\n  segment_length: 1ns\n  precision: mixed\n  cpu_threads: 4\n  report_interval: 10ps\n  checkpoint_interval: 100ps\n  seed: 20261008\n  pressure_unit: atm\nanalysis:\n  formal_window_ns: [400, 500]\n  alignment_selection: \"protein and backbone\"\n  block_ns: 10\n  rmsd: true\n  rmsf: true\n  hbond: true\n  contacts: true\n  distance: true\n  stride: 1\n  discard_ns: 0\n  contact_cutoff_angstrom: 4.5\n  hbond_distance_angstrom: 3.0\n  hbond_angle_degrees: 150\n  key_residue_occupancy: 0.3\n  distance_pairs: []\n  groups: {}\n  sasa: true\n  sasa_stride: 10\n  sasa_points: 100\n  sasa_probe_angstrom: 1.4\nreplicates: 1\nmmgbsa:\n  enabled: false\n  igb: 5\n  salt_molar: 0.15\n  max_frames: 200\n  start_ns: 0\n  entropy: false\nmmpbsa:\n  enabled: true\n  start_ns: 400\n  end_ns: 500\n  stride: 10\n  interior_dielectric: 1.0\n  exterior_dielectric: 80.0\n  salt_molar: 0.15\n  entropy: false\n  membrane: false\n"
