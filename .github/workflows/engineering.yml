name: Engineering checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: engineering-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts-and-workbench:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: deployment/validation_5090/pip-freeze.txt
      - name: English content and source integrity
        run: |
          python deployment/check_english.py
          python deployment/check_repository.py
          python deployment/check_governance.py
          python deployment/check_scientific_baseline.py
          python deployment/sync_platform_version.py --check
      - name: Install recorded chemistry and web dependencies
        id: dependencies
        run: |
          python -m pip install -r deployment/validation_5090/pip-freeze.txt
          python -m pip install openmm==8.6.1 parmed==4.3.1 meeko==0.8.0
          python -m pip install biopython==1.85 openpyxl==3.1.5 cairosvg==2.7.1 lxml==5.4.0
          python -m pip check
      - name: Generation contracts (no model inference)
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: 01_molecule_generation
        run: PYTHONPATH=. python -m pytest tests -q --junitxml=../generation-tests.xml
      - name: Full workbench and scientific handoff regressions
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: 00_workbench
        run: PYTHONPATH=. python -m pytest tests -q --junitxml=../workbench-tests.xml
      - name: Screening contracts and portable real-data fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: 03_virtual_screening
        run: PYTHONPATH=src python -m pytest tests -m 'not integration' -q --junitxml=../screening-tests.xml
      - name: Docking contracts
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: 02_docking
        run: PYTHONPATH=src python -m pytest tests -q --junitxml=../docking-tests.xml
      - name: Install isolated PyMOL renderer
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          python -m venv "$RUNNER_TEMP/yuanhe-pymol"
          "$RUNNER_TEMP/yuanhe-pymol/bin/python" -m pip install numpy==2.2.6 pymol-open-source==3.2.0a0
          "$RUNNER_TEMP/yuanhe-pymol/bin/python" -m pip check
      - name: Interaction analysis
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: 04_interaction_analysis
        env:
          ZLIS_PYMOL_PYTHON: ${{ runner.temp }}/yuanhe-pymol/bin/python
        run: PYTHONPATH=src python -m pytest tests -q --junitxml=../interaction-tests.xml
      - name: Standalone MD contracts
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: 05_molecular_dynamics
        run: python -m pytest tests -q --junitxml=../md-tests.xml
      - name: Independent package integrity and entrypoints
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python -m pytest deployment/tests -q --junitxml=package-tests.xml
      - uses: actions/setup-node@v7
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Frontend syntax
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node --experimental-vm-modules 00_workbench/webui/check_js.mjs
      - name: Public demo frozen build and source contracts
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: 06_websites/01_public_demo/yuanhe-public
        run: |
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile --ignore-scripts
          node node_modules/typescript/bin/tsc
          node node_modules/vite/bin/vite.js build
          node --test tests/*.test.mjs
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: engineering-test-reports
          path: '*-tests.xml'
