name: Engineering checks
on: [push, pull_request, workflow_dispatch]
jobs:
  generation-and-workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest numpy rdkit
      - name: Generation contracts (no model inference)
        working-directory: 01_molecule_generation
        run: PYTHONPATH=. python -m pytest tests -q
      - name: Workflow and HTTP regressions
        working-directory: 00_workbench
        run: PYTHONPATH=. python -m pytest tests/test_workflow_regressions.py -q
