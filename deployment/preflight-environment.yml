# Separate from the unchanged MD environment. Models, templates and planning building-block
# datasets are never installed/downloaded automatically by the workflow.
name: yuanhe-preflight
channels: [conda-forge, nodefaults]
dependencies:
  - python=3.11
  - rdkit=2026.03.1
  - filelock>=3.13
  - pyyaml>=6
  - pytest>=8
  - pip
  - pip:
      - aizynthfinder==4.4.1
